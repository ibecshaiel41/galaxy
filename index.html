<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="imgs/logo.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Happy Birthday">
<title>galaxia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: #000; overflow: hidden;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        -webkit-tap-highlight-color: transparent;
    }
    #bg-canvas {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        display: block; z-index: 0; cursor: grab;
        touch-action: none;
    }
    #bg-canvas:active { cursor: grabbing; }
    #bg-canvas.can-tap { cursor: pointer; }

    :root {
        --start-ink: #f8f4ff; --start-mist: #d8cbff;
        --start-accent: #ff78c7; --start-accent-2: #7dd8ff;
        --start-panel: rgba(13,7,28,0.62); --start-stroke: rgba(255,255,255,0.24);
    }

    #start-overlay {
        position: fixed; inset: 0; z-index: 20;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        background:
            radial-gradient(70% 55% at 15% 100%, rgba(255,80,170,0.2), transparent 68%),
            radial-gradient(60% 45% at 90% 10%, rgba(90,120,255,0.24), transparent 70%),
            radial-gradient(120% 100% at 50% 50%, rgba(35,15,75,0.8), rgba(4,2,12,0.98));
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #start-overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    #start-overlay::before, #start-overlay::after {
        content: ""; position: absolute;
        width: 46vmax; height: 46vmax;
        border-radius: 50%; filter: blur(40px);
        pointer-events: none; opacity: 0.32;
        animation: startDrift 8s ease-in-out infinite;
    }
    #start-overlay::before {
        left: -12vmax; bottom: -18vmax;
        background: radial-gradient(circle, rgba(255,100,180,0.75), transparent 65%);
    }
    #start-overlay::after {
        right: -15vmax; top: -15vmax;
        background: radial-gradient(circle, rgba(90,185,255,0.72), transparent 66%);
        animation-delay: -4s;
    }
    @keyframes startDrift {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(4vmax, -3vmax) scale(1.12); }
    }

    #start-card {
        position: relative; z-index: 2; text-align: center;
        color: var(--start-ink); width: min(92vw, 760px);
        padding: clamp(28px,5vw,54px) clamp(24px,5vw,62px);
        border: 1px solid var(--start-stroke); border-radius: 28px;
        background:
            linear-gradient(160deg, rgba(255,255,255,0.08), transparent 42%),
            linear-gradient(20deg, rgba(255,120,199,0.1), rgba(125,216,255,0.05)),
            var(--start-panel);
        box-shadow: 0 35px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.26);
        animation: cardFloat 4.5s ease-in-out infinite;
    }
    @keyframes cardFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    #start-title {
        margin: 0; font-family: 'Playfair Display', Georgia, serif;
        font-weight: 900; font-size: clamp(2.2rem, 9vw, 4.2rem);
        line-height: 1.05; letter-spacing: -0.01em;
        text-shadow: 0 0 28px rgba(255,150,220,0.55);
    }
    #start-gif {
        width: clamp(170px,32vw,260px); height: clamp(170px,32vw,260px);
        object-fit: contain; border-radius: 0;
        margin: 12px auto 16px; display: block; border: 0; background: transparent;
    }
    .start-emoji {
        font-size: clamp(90px, 20vw, 150px); line-height: 1.1;
        margin: 12px auto 16px; filter: drop-shadow(0 0 22px rgba(255,120,199,.6));
    }
    #start-sub {
        margin: 0 0 22px; font-size: clamp(.68rem, 2.4vw, .85rem);
        letter-spacing: .22em; color: var(--start-mist);
    }
    #start-btn {
        font-family: inherit; font-weight: 700; letter-spacing: .2em;
        font-size: .8rem; color: var(--start-ink); cursor: pointer;
        padding: 14px 34px; border-radius: 999px;
        border: 1px solid rgba(190,170,255,.7);
        background: linear-gradient(135deg, #5a2a8f, #3c3a99);
        box-shadow: 0 0 26px rgba(255,120,199,.45);
        transition: transform .2s ease, box-shadow .2s ease;
    }
    #start-btn:hover { transform: scale(1.06); box-shadow: 0 0 38px rgba(255,120,199,.75); }
    #start-btn:active { transform: scale(.97); }

    .hud-btn {
        position: fixed; z-index: 15;
        top: calc(18px + env(safe-area-inset-top, 0px));
        width: 46px; height: 46px; border-radius: 50%;
        display: grid; place-items: center; cursor: pointer;
        border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 0;
        opacity: 0; pointer-events: none;
        transition: opacity .8s ease, transform .2s ease;
    }
    body.live .hud-btn { opacity: 1; pointer-events: auto; }
    .hud-btn:active { transform: scale(.92); }
    .hud-btn svg { width: 20px; height: 20px; fill: currentColor; }
    #fs-btn {
        left: calc(18px + env(safe-area-inset-left, 0px));
        background: linear-gradient(135deg, #9a65dd, #5b4aa8);
        box-shadow: 0 0 18px rgba(154,101,221,.5);
    }
    .music-btn {
        right: calc(18px + env(safe-area-inset-right, 0px));
        background: #e8335f; box-shadow: 0 0 18px rgba(232,51,95,.6);
    }

    #warp-btn {
        position: fixed; z-index: 15; left: 50%; transform: translateX(-50%);
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        padding: 12px 22px; border-radius: 999px; white-space: nowrap;
        border: 1px solid rgba(190,170,255,.65);
        background: linear-gradient(135deg, rgba(90,42,143,.88), rgba(60,58,153,.88));
        color: #fff; font-family: inherit; font-weight: 700; font-size: .74rem; letter-spacing: .1em;
        cursor: pointer; box-shadow: 0 0 24px rgba(255,120,199,.4);
        opacity: 0; pointer-events: none; transition: opacity .6s ease, box-shadow .2s ease;
    }
    #warp-btn:hover { box-shadow: 0 0 36px rgba(255,120,199,.75); }
    body.live.ready #warp-btn { opacity: 1; pointer-events: auto; }
    body.busy #warp-btn, body.busy #hint { opacity: 0 !important; pointer-events: none !important; }

    #hint {
        position: fixed; z-index: 10; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%); width: max-content; max-width: 90vw;
        padding: 10px 18px; border-radius: 999px; text-align: center;
        font-size: .72rem; letter-spacing: .08em; color: var(--start-mist);
        background: rgba(13,7,28,.6); border: 1px solid var(--start-stroke);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        opacity: 0; pointer-events: none; transition: opacity 1s ease;
    }
    #hint.show { opacity: 1; }

    #flight-label {
        position: fixed; z-index: 16; left: 50%;
        top: calc(78px + env(safe-area-inset-top, 0px));
        transform: translateX(-50%) translateY(-6px);
        padding: 9px 20px; border-radius: 999px;
        font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 1rem;
        color: #ffe6f6; background: rgba(13,7,28,.55); border: 1px solid var(--start-stroke);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        opacity: 0; pointer-events: none; white-space: nowrap; max-width: 92vw;
        overflow: hidden; text-overflow: ellipsis;
        transition: opacity .6s ease, transform .6s ease;
    }
    #flight-label.show { opacity: 1; transform: translateX(-50%); }

    #modal {
        position: fixed; inset: 0; z-index: 40;
        display: flex; align-items: center; justify-content: center;
        padding: 20px; overflow: hidden;
        background: rgba(6,0,18,.55);
        backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
        opacity: 0; visibility: hidden;
        transition: opacity .35s ease, visibility .35s ease;
    }
    #modal.open { opacity: 1; visibility: visible; }

    #m-bg {
        position: absolute; inset: 0; z-index: 0;
        background-size: cover; background-position: center; background-repeat: no-repeat;
        clip-path: circle(0px at 50% 50%);
        transition: clip-path 1.25s cubic-bezier(.2,.75,.2,1);
        display: none;
    }
    #m-bg::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(6,0,18,.35) 0%, rgba(6,0,18,0) 30%, rgba(6,0,18,0) 52%, rgba(6,0,18,.78) 100%);
    }
    #modal.has-bg {
        background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
        align-items: flex-end; padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    }
    #modal.has-bg #m-bg { display: block; }

    #modal-card {
        position: relative; z-index: 1;
        width: min(92vw, 520px); max-height: 86vh; overflow-y: auto;
        text-align: center; color: var(--start-ink);
        padding: 34px 28px 28px;
        border: 1px solid rgba(255,255,255,.28); border-radius: 28px;
        background:
            linear-gradient(160deg, rgba(255,255,255,.09), transparent 45%),
            linear-gradient(20deg, rgba(255,120,199,.14), rgba(125,216,255,.06)),
            rgba(18,8,38,.86);
        box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 60px rgba(255,100,190,.25), inset 0 1px 0 rgba(255,255,255,.3);
        transform: scale(.82) translateY(24px);
        transition: transform .5s cubic-bezier(.2,1.3,.4,1);
    }
    #modal.open #modal-card { transform: none; }
    #modal.has-bg #modal-card {
        padding: 26px 24px 22px;
        background:
            linear-gradient(160deg, rgba(255,255,255,.1), transparent 45%),
            rgba(14,6,30,.5);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    #m-img {
        display: none; width: 150px; height: 150px; margin: 0 auto 16px;
        border-radius: 50%; object-fit: cover; background: #fff;
        border: 3px solid rgba(255,150,210,.85);
        box-shadow: 0 0 28px rgba(255,120,199,.6);
    }
    #m-title {
        margin: 0 0 14px; font-family: 'Playfair Display', Georgia, serif;
        font-weight: 900; font-size: clamp(1.5rem, 6vw, 2.1rem); line-height: 1.15;
        background: linear-gradient(90deg, #ffd1ec, #ff8fd0, #bda8ff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 12px rgba(255,120,199,.4));
    }
    #m-text {
        margin: 0 0 18px; min-height: 5.4em; white-space: pre-line;
        font-family: 'Dancing Script', 'Playfair Display', cursive;
        font-weight: 500; font-size: clamp(1.35rem, 5.4vw, 1.75rem); line-height: 1.45;
        color: #fbeaff;
    }
    #m-sign {
        margin: 0; font-family: 'Playfair Display', Georgia, serif;
        font-style: italic; font-size: .95rem; color: var(--start-mist);
    }
    #m-close {
        position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
        border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
        background: rgba(255,255,255,.08); color: #fff; font-size: 1rem; cursor: pointer;
    }
    #m-close:hover { background: rgba(255,120,199,.35); }
    #hearts { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
    .rise {
        position: absolute; bottom: -40px; opacity: 0;
        animation: rise var(--d, 3s) ease-in forwards;
    }
    @keyframes rise {
        0% { transform: translate(0,0) scale(.6); opacity: 0; }
        15% { opacity: .95; }
        100% { transform: translate(var(--dx, 0px), -105vh) scale(1.3) rotate(var(--r, 0deg)); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        #start-card, #start-overlay::before, #start-overlay::after { animation: none; }
    }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- INICIO -->
<div id="start-overlay">
    <div id="start-card">
        <h1 id="start-title"></h1>
        <div id="start-media"></div>
        <p id="start-sub"></p>
        <button id="start-btn" type="button">INICIAR</button>
    </div>
</div>

<!-- BOTONES -->
<button id="fs-btn" class="hud-btn" type="button" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5z"/></svg>
</button>
<button id="music-btn" class="hud-btn music-btn" type="button" aria-label="Música"></button>
<button id="warp-btn" type="button"></button>

<div id="flight-label"></div>
<div id="hint">Toca los planetas para viajar 🛸 </div>

<!-- TEXTO LINDO -->
<div id="modal" aria-hidden="true">
    <div id="m-bg"></div>
    <div id="modal-card" role="dialog" aria-modal="true">
        <button id="m-close" type="button" aria-label="Cerrar">✕</button>
        <img id="m-img" alt="" />
        <h2 id="m-title"></h2>
        <p id="m-text"></p>
        <p id="m-sign"></p>
    </div>
</div>
<div id="hearts"></div>

<script>
(() => {
'use strict';

const CONFIG = {
    titulo: 'Feliz cumpleaños',
    subtitulo: 'Te amo🫀',
    gifInicio: 'imgs/cumple.gif',          // Ej: 'osos.gif'  (misma carpeta que este HTML). Vacío = emoji 🧸
    musica: '',             // Ej: 'cancion.mp3'. Vacío = melodía suave generada
    firma: '— Con todo mi amor 💗',
    galaxias: ['Galaxia Amor', 'Galaxia del mañana'],

    // ---- Palabras flotantes de la GALAXIA ROSA ----
    palabras: [
        { t: 'CORAZÓN', titulo: 'Mi corazón es tuyo', texto: 'Desde el día que llegaste, mi corazón dejó de ser mío.\nLate con tu nombre, y no pienso pedirlo de vuelta.' },
        { t: 'CONTIGO SIEMPRE', titulo: 'Contigo siempre', texto: 'Cuando el día es largo o el mundo pesa,\ncontigo siempre es el mejor lugar donde puedo estar.' },
        { t: 'INFINITO', titulo: 'Infinito', texto: 'Si pudiera contar cuánto te quiero,\nlos números se acabarían primero.' },
        { t: 'ETERNO', titulo: 'Eterno', texto: 'No sé qué significa para siempre,\npero sé que hay momentos contigo que quisiera conservar más allá del tiempo.'},
        { t: 'TE AMO', titulo: 'Te amo', texto: 'Decirlo es sencillo.\nLo difícil es explicar todo lo que esas dos palabras pueden llegar a contener.'},
        { t: 'PRINCESA', titulo: 'Mi princesita', texto: 'Eres mi cuento favorito,\nla parte bonita de cada uno de mis días.' },
        { t: 'UNIVERSO', titulo: 'Eres mi universo', texto: 'Podría recorrer mil galaxias\ny aun así mi lugar favorito seguiría siendo a tu lado.' },
        { t: 'MI PERSONA', titulo: 'Mi persona favorita', texto: 'Entre tanta gente en el mundo,\nmi corazón te eligió a ti. Y volvería a elegirte siempre.' },
        { t: 'EXISTIR', titulo: 'Gracias por existir', texto: 'Gracias por tu risa, tu paciencia y tu forma de quererme , \ngracias por los momentos juntos y \nlas enseñanzas que nos hemos dado.\n' },
        { t: 'TÚ', titulo: 'Siempre tú', texto: 'Si tuviera que empezar de nuevo,\nme gustaría volver a encontrarte a ti.' },
        { t: 'PHILIA', titulo: 'Philia', texto: 'Aristóteles entendía el cariño como algo que también nace\nde admirar, comprender y querer el bien del otro.'},
        { t: 'PLATÓN', titulo: 'Platón', texto: 'Quizá por eso algunas personas nos despiertan algo extraño:\nla sensación de haber encontrado algo que no sabíamos que buscábamos.'},
        { t: 'ARISTÓTELES', titulo: 'Aristóteles', texto: 'Amar también es alegrarse por la existencia del otro,\nno solo por lo que esa persona puede darnos.'},
        { t: 'EROS', titulo: 'Eros', texto: 'Quizá amar sea reconocer algo hermoso en alguien\ny querer conocerlo cada vez más profundamente.'}
    ],

    // ---- Palabras flotantes de la GALAXIA AZUL ----
    palabras2: [
        { t: 'ARETÉ', titulo: 'Areté', texto: 'No se trata de ser perfecta.\nSe trata de acercarte cada día a quien quieres llegar a ser ,\n la perfección no se mide en cómo te vez,\n si no en como logras verte tu cada día .'},
        { t: 'TÚ', titulo: 'Tú', texto: 'Todavía no sabes cuántas versiones de ti\nte quedan por conocer, así que tenemos mucho por lo cual celebrar.'},
        { t: 'MELTEMI', titulo: 'Meltemi', texto: 'El viento no pregunta hacia dónde queremos ir.\nA veces simplemente nos enseña a navegar.'},
        { t: 'ÍTACA', titulo: 'Ítaca', texto: 'Quizá lo importante de llegar algún día\nsea todo lo que aprendiste mientras estabas lejos.'},
        { t: 'ÍCARO', titulo: 'Ícaro', texto: 'No siempre es la altura lo que importa,\nsino haber tenido el valor de mirar hacia arriba.'},
        { t: 'ODISEA', titulo: 'La Odisea', texto: 'No todos los caminos existen para llevarnos a un lugar.\nAlgunos existen para mostrarnos quiénes somos.'},
        { t: 'ARGOS', titulo: 'Argos', texto: 'Hay cosas que el tiempo puede alejar,\npero no necesariamente borrar.'},
        { t: 'LEJOS', titulo: 'Lejos', texto: 'Hay lugares que todavía no conoces\ny versiones de ti que solo existen allí.'},
        { t: 'TE AMO', titulo: 'Te amo', texto: 'Dos palabras pequeñas para algo tan inmenso.\nTe amo hoy, mañana y en todas las vidas que existan.' },
        { t: 'NÁUFRAGO', titulo: 'Náufrago', texto: 'A veces perder el rumbo\nes la primera forma de encontrar otro, no te pierdas encontrando un rumbo.'},
        { t: 'SÍSIFO', titulo: 'Sísifo', texto: 'Quizá avanzar no siempre sea llegar más lejos,\nsino volver a intentarlo con una mirada distinta.'},
        { t: 'SELENE', titulo: 'Selene', texto: 'La luna nunca deja de cambiar,\ny aun así seguimos reconociéndola.'},
        { t: 'PREGUNTAS', titulo: 'Preguntas', texto: 'Nunca tengas miedo de no tener respuestas.\nLas mejores historias suelen comenzar con una pregunta.'},
        { t: 'CRECER', titulo: 'Crecer', texto: 'Algún día mirarás hacia atrás\ny descubrirás que ya eres alguien que antes soñabas ser.'}
    ],

    // ---- Planetas (al tocarlos viajas hasta ellos en la nave) ----
    // fondo: (opcional) imagen que se abre de fondo al llegar, ej: fondo: 'playa.jpg'
    // galaxia: 1 = Rosa, 2 = Azul · kind: 0 rosa con anillo, 1 océano, 2 violeta, 3 atardecer, 4 hielo, 5 dorado
planetas: [
    { galaxia: 1, kind: 0, fondo: 'imgs/elysia.PNG', titulo: 'Elysia',
        texto: 'Un planeta cubierto de jardines interminables,\ndonde las flores crecen incluso entre las ruinas antiguas.\nDicen que aquí el tiempo avanza más despacio,\ncomo si el mundo quisiera darte unos minutos más para contemplarlo.\nQuizá por eso este lugar recuerda que algunas cosas bonitas\nsolo necesitan tiempo para florecer.'},
    { galaxia: 1, kind: 1, fondo:'imgs/thalassa.PNG', titulo: 'Thalassa',
        texto: 'Casi todo este planeta está cubierto por un océano profundo y transparente.\nBajo su superficie existen ciudades antiguas que nadie ha conseguido explorar por completo.\nDesde la orilla, el horizonte parece infinito.\nTal vez el mar nos recuerda que conocer algo de verdad\nsignifica aceptar que siempre quedará algo por descubrir juntos.'},
    { galaxia: 1, kind: 3, fondo:'imgs/aurelia.PNG', titulo: 'Aurelia',
        texto: 'Su atmósfera convierte cada atardecer en un espectáculo de colores imposibles.\nDurante unos minutos, todo el planeta parece quedar suspendido entre el día y la noche.\nLos habitantes de Aurelia llaman a ese momento “la hora que no pertenece a ningún mundo”.\nQuizá porque algunas cosas hermosas existen precisamente entre dos momentos inolvidables.'},
    { galaxia: 1, kind: 2, fondo:'imgs/lumen.jpg', titulo: 'Lumen',
        texto: 'Un pequeño planeta cubierto por bosques violetas que brillan durante la noche.\nSus plantas almacenan la luz del día y la devuelven lentamente cuando todo queda oscuro.\nAquí nadie teme demasiado a la noche,\nporque saben que incluso la oscuridad puede guardar su propia forma de luz.'},
    { galaxia: 2, kind: 4, fondo:'imgs/nivaria.jpg', titulo: 'Nivaria',
        texto: 'Un mundo cubierto de hielo donde las montañas parecen extenderse hasta el cielo.\nA pesar de su frío extremo, bajo la superficie existe un enorme océano cálido.\nNadie puede verlo desde el exterior,\npero su existencia recuerda que las apariencias nunca cuentan toda la historia.'},
    { galaxia: 2, kind: 5, fondo:'imgs/aureum.jpg', titulo: 'Aureum',
        texto: 'Su superficie está cubierta por minerales dorados que reflejan la luz de su estrella.\nDesde el espacio parece un pequeño sol perdido entre la oscuridad.\nPero quienes lo han visitado dicen que su verdadero valor no está en lo que brilla,\nsino en todo aquello que permanece cuando la luz desaparece.'},
    { galaxia: 2, kind: 1, fondo:'imgs/pelagos.JPG', titulo: 'Pelagos',
        texto: 'Un planeta donde los continentes son apenas pequeñas islas rodeadas por un océano inmenso.\nLas mareas pueden tardar meses en completar un solo ciclo.\nSus habitantes aprendieron hace mucho que el mar nunca permanece igual,\ny que cambiar de dirección no significa necesariamente haber perdido el rumbo.'},
    { galaxia: 2, kind: 0, fondo:'imgs/astraea.jpg', titulo: 'Astraea',
        texto: 'Un mundo oscuro donde el cielo permanece lleno de estrellas incluso durante el día.\nDesde cualquier punto de su superficie pueden observarse miles de galaxias lejanas.\nLos antiguos astrónomos de Astraea decían que mirar el cielo era recordar algo sencillo:\nque todavía existe muchísimo más allá de aquello que conocemos.'}

function project(x, y, z) {
    x -= cam.x; y -= cam.y; z -= cam.z;
    const x1 = x * cYaw - z * sYaw, z1 = x * sYaw + z * cYaw;
    const y1 = y * cPit + z1 * sPit, z2 = z1 * cPit - y * sPit;
    const zc = z2 + camD;
    if (zc < 60) return false;
    const s = foc / zc;
    PX = ox + x1 * s; PY = oy - y1 * s; PS = s; PZ = zc;
    return true;
}

function makeGalaxy(o) {
    const parts = [], R = o.R;
    for (let i = 0; i < o.N; i++) {                          // brazos espirales
        const arm = i % o.arms;
        const u = Math.pow(Math.random(), 0.72), r = 40 + u * R, rn = r / R;
        const ang = arm * (TAU / o.arms) + r * o.twist + (0.5 * (1 - rn) + 0.1) * gauss() * 1.25;
        const jr = gauss() * (8 + rn * 26);
        parts.push({ x: Math.cos(ang) * (r + jr), z: Math.sin(ang) * (r + jr),
            y: gauss() * (14 * (1 - rn) + 3),
            c: clamp(Math.floor(rn * 7 + Math.random() * 2.2 - 0.6), 0, 7), s: rnd(2.2, 5.4) });
    }
    for (let i = 0; i < o.core; i++) {                        // núcleo
        const a = Math.random() * TAU, r = Math.abs(gauss()) * 110;
        parts.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, y: gauss() * 14,
            c: Math.floor(Math.random() * 3), s: rnd(2.4, 5) });
    }
    for (let i = 0; i < o.dust; i++) {                        // polvo
        const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * R * 1.18;
        parts.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, y: gauss() * 22,
            c: 3 + Math.floor(Math.random() * 5), s: rnd(1.6, 3.2) });
    }
    parts.sort((a, b) => a.c - b.c);
    const N = parts.length;
    const g = { x: o.x, y: o.y, z: o.z, R, N, spin: o.spin, name: o.name,
        gx: new Float32Array(N), gy: new Float32Array(N), gz: new Float32Array(N),
        gs: new Float32Array(N), gc: new Uint8Array(N),
        pal: o.pal.map(c => `rgba(${c},0.85)`) };
    parts.forEach((p, i) => { g.gx[i] = p.x; g.gy[i] = p.y; g.gz[i] = p.z; g.gs[i] = p.s; g.gc[i] = p.c; });
    return g;
}

// Emblemas de partículas: corazón (rosa) e infinito (azul)
function buildEmblem(kind) {
    const pts = [];
    if (kind === 0) {
        const HS = 12;
        const hp = t => [16 * Math.pow(Math.sin(t), 3),
            13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
        for (let i = 0; i < 1500; i++) {
            const t = Math.random() * TAU, [x, y] = hp(t), edge = i < 900;
            const k = edge ? 1 + gauss() * 0.045 : Math.sqrt(Math.random()) * 0.94;
            pts.push({ x: x * k * HS + gauss() * (edge ? 5 : 9), y: y * k * HS + gauss() * (edge ? 5 : 9),
                z: gauss() * (edge ? 16 : 28), p: Math.random() * TAU, s: rnd(2.4, edge ? 5.4 : 4.2), c: i % 3 });
        }
        return { pts: pts.sort((a, b) => a.c - b.c), y: 400, hr: 190,
            cols: ['rgba(255,70,225,0.9)', 'rgba(255,130,235,0.85)', 'rgba(210,90,255,0.85)'] };
    }
    const A = 230;
    for (let i = 0; i < 1600; i++) {
        const t = Math.random() * TAU, d = 1 + Math.sin(t) * Math.sin(t), edge = i < 1100;
        pts.push({ x: A * Math.cos(t) / d + gauss() * (edge ? 4 : 14),
            y: A * Math.sin(t) * Math.cos(t) / d * 1.3 + gauss() * (edge ? 4 : 14),
            z: gauss() * (edge ? 14 : 26), p: Math.random() * TAU, s: rnd(2.4, edge ? 5.2 : 4), c: i % 3 });
    }
    return { pts: pts.sort((a, b) => a.c - b.c), y: 390, hr: 230,
        cols: ['rgba(110,235,255,0.9)', 'rgba(255,235,170,0.9)', 'rgba(150,175,255,0.88)'] };
}

function makePhotoItem(src) {
    const S = 288, c = document.createElement('canvas'), g = c.getContext('2d');
    c.width = c.height = S;
    const cx = S / 2, R = S / 2 - 26;
    const paint = im => {
        g.clearRect(0, 0, S, S);
        let gl = g.createRadialGradient(cx, cx, R * 0.9, cx, cx, R * 1.28);
        gl.addColorStop(0, 'rgba(255,130,200,0.55)'); gl.addColorStop(1, 'rgba(255,130,200,0)');
        g.fillStyle = gl; g.fillRect(0, 0, S, S);
        g.save(); g.beginPath(); g.arc(cx, cx, R, 0, TAU); g.clip();
        g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
        if (im) {
            const sc = Math.max(2 * R / im.width, 2 * R / im.height);
            g.drawImage(im, cx - im.width * sc / 2, cx - im.height * sc / 2, im.width * sc, im.height * sc);
        } else {
            g.fillStyle = '#222'; g.font = "700 44px 'JetBrains Mono', monospace"; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText('te amo', cx, cx - 8);
            g.font = '56px sans-serif'; g.fillText('❤️', cx, cx + 52);
        }
        const sh = g.createRadialGradient(cx - R * 0.38, cx - R * 0.38, R * 0.15, cx, cx, R * 1.04);
        sh.addColorStop(0, 'rgba(255,255,255,0.18)'); sh.addColorStop(0.55, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(12,0,30,0.55)');
        g.fillStyle = sh; g.fillRect(0, 0, S, S);
        g.restore();
        g.beginPath(); g.arc(cx, cx, R, 0, TAU); g.lineWidth = 5; g.strokeStyle = 'rgba(255,170,220,0.95)'; g.stroke();
    };
    paint(null);
    let fallback = '';
    try { fallback = c.toDataURL(); } catch (e) {}
    if (src) {
        const im = new Image();
        im.onload = () => paint(im);
        im.src = src;
    }
    return { spr: c, fallback };
}

    { a: '#ffeaa8', b: '#d6921f', glow: '255,215,120', bands: 1, ring: '255,235,170', tint: '255,205,100' }
];
function makePlanetSprite(kd) {
    const S = 320, c = document.createElement('canvas'), g = c.getContext('2d');
    c.width = c.height = S;
    const cx = S / 2, cy = S / 2, R = kd.ring ? 74 : 96;
    let gr = g.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 1.5);
    gr.addColorStop(0, `rgba(${kd.glow},0.45)`); gr.addColorStop(1, `rgba(${kd.glow},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    const ring = front => {
        g.save(); g.translate(cx, cy); g.rotate(-0.32);
        if (front) { g.beginPath(); g.rect(-S, 0, S * 2, S); g.clip(); }
        [[R * 1.55, 8, 0.85], [R * 1.78, 12, 0.5], [R * 2.0, 6, 0.7]].forEach(([rx, w, al]) => {
            g.beginPath(); g.ellipse(0, 0, rx, rx * 0.28, 0, 0, TAU);
            g.lineWidth = w; g.strokeStyle = `rgba(${kd.ring},${al})`; g.stroke();
        });
        g.restore();
    };
    if (kd.ring) ring(false);
    g.save(); g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
    const bg = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    bg.addColorStop(0, kd.a); bg.addColorStop(1, kd.b);
    g.fillStyle = bg; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
    if (kd.bands) for (let i = 0; i < 14; i++) {
        g.fillStyle = `rgba(${i % 2 ? '255,255,255' : '60,20,90'},${rnd(0.08, 0.22)})`;
        g.fillRect(cx - R, cy - R + i * (2 * R / 14) + rnd(-4, 4), 2 * R, rnd(5, 14));
    }
    if (kd.clouds) for (let i = 0; i < 26; i++) {
        g.fillStyle = `rgba(255,255,255,${rnd(0.12, 0.3)})`; g.beginPath();
        g.ellipse(cx + rnd(-R, R), cy + rnd(-R, R), rnd(12, 34), rnd(4, 10), rnd(-0.4, 0.4), 0, TAU); g.fill();
    }
    if (kd.craters) for (let i = 0; i < 12; i++) {
        const x = cx + rnd(-R * 0.8, R * 0.8), y = cy + rnd(-R * 0.8, R * 0.8), r = rnd(5, 16);
        g.fillStyle = 'rgba(80,20,10,0.35)'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        g.strokeStyle = 'rgba(255,220,190,0.35)'; g.lineWidth = 2; g.stroke();
    }
    const sh = g.createRadialGradient(cx - R * 0.4, cy - R * 0.4, R * 0.1, cx, cy, R * 1.05);
    sh.addColorStop(0, 'rgba(255,255,255,0.28)'); sh.addColorStop(0.45, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(8,0,24,0.78)');
    g.fillStyle = sh; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
    g.restore();
    g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.lineWidth = 2; g.strokeStyle = `rgba(${kd.glow},0.55)`; g.stroke();
    if (kd.ring) ring(true);
    return c;
}

let mode = 'idle';            // idle | travel | fly | landed | return

}
function syncUI() {

function itemWorld(it, t) {
    const g = G[it.g], a = it.a + t * it.w, y = it.y + Math.sin(t * 0.8 + it.ph) * 10;
    return [g.x + Math.cos(a) * it.r, g.y + y, g.z + Math.sin(a) * it.r];

function startTravel(to) {
    if (mode !== 'idle' || modalOpen || !interactive) return;
    mode = 'travel';
    flight = { t0: nowT(), dur: 5.6, to, sx: cam.x, sy: cam.y, sz: cam.z, sd: cam.d };
    showLabel('Rumbo a la ' + G[to].name + ' ✦', 4600);
    syncUI();
}
function startFly(it) {
    if (mode !== 'idle' || modalOpen) return;
    mode = 'fly';
    const wpx = it.spr.width * it.k, want = Math.min(W, H) * 0.62;
    const td = clamp(foc / (want / wpx), 120, 900);
    flight = { t0: nowT(), dur: 3.4, it, td, sx: cam.x, sy: cam.y, sz: cam.z, sd: cam.d };
    showLabel('Rumbo a «' + it.titulo + '»', 3000);

}
function arrive(it) {

}
function endLanding() {

}

function updateCamera(t, dt, introD) {

    if (mode === 'travel') {
        const f = flight, p = clamp((t - f.t0) / f.dur, 0, 1), e = easeIO(p), T = G[f.to];
        cam.x = lerp(f.sx, T.x, e); cam.y = lerp(f.sy, T.y, e); cam.z = lerp(f.sz, T.z, e);
        cam.d = lerp(f.sd, 1500, e) + 2300 * Math.sin(Math.PI * e);
        const bell = Math.sin(Math.PI * p);
        fxWarp = Math.pow(bell, 1.2); yf = 0.9 * bell; pf = -0.18 * bell;
        if (p >= 1) {
            cur = f.to; mode = 'idle'; flight = null;
            showLabel(G[cur].name + ' ✦', 2800); syncUI();
        }
    } else if (mode === 'fly') {
        const f = flight, p = clamp((t - f.t0) / f.dur, 0, 1), e = easeIO(p), w = itemWorld(f.it, t);
        cam.x = lerp(f.sx, w[0], e); cam.y = lerp(f.sy, w[1], e); cam.z = lerp(f.sz, w[2], e);
        cam.d = lerp(f.sd, f.td, e);

function drawGalaxy(g, t) {

        if (!project(g.x + lx, g.y + g.gy[i], g.z + lz)) continue;
        if (PX < -6 || PX > W + 6 || PY < -6 || PY > H + 6) continue;

function drawEmblem(g, gi, t, canTap) {

function frame(ts) {

    const sFit = Math.min(0.5 * H / 560, 0.48 * W / 640);
    foc = sFit * 1500;
    const pe = clamp(pitch + pitchFx, 0.05, 1.3);
    cPit = Math.cos(pe); sPit = Math.sin(pe);
    ox = W / 2 + (Math.random() - 0.5) * fxWarp * 4; oy = H * 0.6 + (Math.random() - 0.5) * fxWarp * 4;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    drawWarp(dt, wA);

    hitList = [];
    const canTap = interactive && mode === 'idle' && !modalOpen;

    if (gA > 0) {
        ctx.globalAlpha = gA;
        setCam(yawE);

        // cielo de estrellas
        ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,.75)';
        for (const s of bgStars) {
            if (!project(cam.x + s.x, cam.y + s.y, cam.z + s.z)) continue;
            if (PX < 0 || PX > W || PY < 0 || PY > H) continue;
            const sz = s.s * (0.7 + 0.3 * Math.sin(t * 2 + s.p));
            ctx.fillRect(PX, PY, sz, sz);
        }

        // galaxias
        for (let gi = 0; gi < 2; gi++) {
            const g = G[gi];
            ctx.globalCompositeOperation = 'lighter';
            if (!drawGalaxy(g, t)) continue;
            if (gi === 0) drawBlackHole(g, t); else drawSun(g, t);
            drawEmblem(g, gi, t, canTap);
        }

        // palabras / fotos / planetas / estrellas / portales
        ctx.globalCompositeOperation = 'source-over';
        const vis = [];
        for (const it of items) {
            const w = itemWorld(it, t);
            if (!project(w[0], w[1], w[2])) continue;
            if (PX < -250 || PX > W + 250 || PY < -250 || PY > H + 250) continue;
            it.px = PX; it.py = PY; it.ps = PS; it.pz = PZ; vis.push(it);
        }
        vis.sort((a, b) => b.pz - a.pz);
        for (const it of vis) {
            const hv = it === hovered ? 1.15 : 1;
            let sc = it.ps * it.k * hv;
            let al = clamp(1.2 - (it.pz - 1000) / 1800, it.type === 'planet' ? 0.6 : 0.35, 1);
            if (it.type === 'star') { al *= 0.75 + 0.25 * Math.sin(t * 2.4 + it.ph); sc *= 0.92 + 0.12 * Math.sin(t * 2 + it.ph); }
            const dw = it.spr.width * sc, dh = it.spr.height * sc;
            ctx.globalAlpha = gA * al;
            if (it.type === 'portal') {
                ctx.globalCompositeOperation = 'lighter';
                ctx.save(); ctx.translate(it.px, it.py); ctx.rotate(t * 0.9);
                ctx.drawImage(it.spr, -dw / 2, -dh / 2, dw, dh); ctx.restore();
                ctx.globalCompositeOperation = 'source-over';
                const lw = it.lbl.width * it.ps * 0.55, lh = it.lbl.height * it.ps * 0.55;
                ctx.drawImage(it.lbl, it.px - lw / 2, it.py + dh / 2 - lh * 0.1, lw, lh);
            } else {
                ctx.drawImage(it.spr, it.px - dw / 2, it.py - dh / 2, dw, dh);
            }
            if (canTap && it.g === cur) {
                it.hx = it.px; it.hy = it.py; it.hw = Math.max(dw / 2, 26); it.hh = Math.max(dh / 2, 26); it.hz = it.pz;
                hitList.push(it);
            }
        }
    }

    // nave y efectos de viaje
    ctx.globalAlpha = 1;
    drawStreaks(dt, fxWarp);
    const shipTarget = (mode === 'travel' || mode === 'fly' || mode === 'return') ? 1 : 0;
    shipA += (shipTarget - shipA) * Math.min(1, dt * 4.5);
    if (shipA > 0.02) drawShip(t, dt, shipA, fxWarp);

    // destellos al tocar
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'lighter';
    for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i]; b.life -= dt * 1.4;
        if (b.life <= 0) { bursts.splice(i, 1); continue; }
        b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.96; b.vy *= 0.96;
        ctx.fillStyle = `rgba(${b.c},${b.life})`;
        ctx.beginPath(); ctx.arc(b.x, b.y, 1 + b.life * 2.4, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
}

const ptrs = new Map();
let downInfo = null, pinchD = 0;

function pick(px, py) {
    let best = null, bz = 1e12;
    for (const it of hitList) {
        if (Math.abs(px - it.hx) <= it.hw && Math.abs(py - it.hy) <= it.hh && it.hz < bz) { best = it; bz = it.hz; }
    }
    return best;
}
function route(it) {
    if (it.type === 'portal') startTravel(1 - cur);
    else if (it.type === 'photo' || it.type === 'planet') startFly(it);
    else openModal(it);
}

cv.addEventListener('pointerdown', e => {
    if (modalOpen || mode !== 'idle') return;
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) downInfo = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); downInfo = null; }
});
cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) {
        if (interactive && !modalOpen && mode === 'idle' && e.pointerType === 'mouse') {
            hovered = pick(e.clientX, e.clientY);
            cv.classList.toggle('can-tap', !!hovered);
        }
        return;
    }
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchD) zoom = clamp(zoom * (pinchD / d), 0.5, 1.9);
        pinchD = d;
    } else if (ptrs.size === 1) {
        if (downInfo) downInfo.moved += Math.abs(dx) + Math.abs(dy);
        yaw -= dx * 0.0052; pitch = clamp(pitch + dy * 0.0042, 0.06, 1.25);
    }
});
function endPtr(e) {
    const had = ptrs.has(e.pointerId);
    ptrs.delete(e.pointerId);
    if (!had) return;
    if (ptrs.size < 2) pinchD = 0;
    if (downInfo && e.type === 'pointerup' && downInfo.moved < 10 && performance.now() - downInfo.t < 600 &&
        interactive && !modalOpen && mode === 'idle') {
        spawnBurst(e.clientX, e.clientY);
        const it = pick(e.clientX, e.clientY);
        if (it) route(it);
    }
    downInfo = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (mode === 'idle') zoom = clamp(zoom * (1 + e.deltaY * 0.0012), 0.5, 1.9);
}, { passive: false });

warpBtn.addEventListener('click', () => startTravel(1 - cur));

const modal = $('#modal'), mTitle = $('#m-title'), mText = $('#m-text'), mImg = $('#m-img'),
      mSign = $('#m-sign'), mBg = $('#m-bg');
let modalOpen = false, typer = null, typeDelay = null, closeTimer = null;

function openModal(it, origin) {
    modalOpen = true; hovered = null; cv.classList.remove('can-tap');
    clearTimeout(closeTimer);
    mTitle.textContent = it.titulo;
    mSign.textContent = CONFIG.firma;
    mText.textContent = '';
    const bgMode = !!origin && (it.type === 'photo' || it.type === 'planet');

    // imagen pequeña (solo si es planeta-foto sin imagen o con imagen que no carga)
    mImg.style.display = 'none'; mImg.removeAttribute('src');
    if (it.type === 'photo' && !it.src && !it.fondo) { mImg.style.display = 'block'; mImg.src = it.fallback; }

    modal.classList.toggle('has-bg', bgMode);
    if (bgMode) {
        const tint = it.tint || '255,130,200';
        let bg = `radial-gradient(circle at 50% 30%, rgba(${tint},.55), rgba(10,4,26,.96) 72%)`;
        const bgSrc = it.fondo || it.src;
        if (bgSrc) {
            bg = `url("${bgSrc.replace(/"/g, '%22')}"), ` + bg;
            if (it.type === 'photo') {
                const test = new Image();
                test.onerror = () => { if (it.fallback) { mImg.src = it.fallback; mImg.style.display = 'block'; } };
                test.src = bgSrc;
            }
        }
        mBg.style.backgroundImage = bg;
        const cx = origin.x || W / 2, cy = origin.y || H / 2;
        mBg.style.transition = 'none';
        mBg.style.clipPath = `circle(0px at ${cx}px ${cy}px)`;
        void mBg.offsetWidth;
        mBg.style.transition = '';
        requestAnimationFrame(() => { mBg.style.clipPath = `circle(160vmax at ${cx}px ${cy}px)`; });
    }

    modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
    syncUI();
    clearInterval(typer); clearTimeout(typeDelay);
    const full = it.texto;
    typeDelay = setTimeout(() => {
        let i = 0;
        typer = setInterval(() => {
            mText.textContent = full.slice(0, ++i);
            if (i >= full.length) clearInterval(typer);
        }, 34);
    }, bgMode ? 950 : 0);
    risingHearts(it.type === 'heart' ? 26 : 14);
}
function closeModal() {
    if (!modalOpen) return;
    modalOpen = false; clearInterval(typer); clearTimeout(typeDelay);
    modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true');
    closeTimer = setTimeout(() => {
        modal.classList.remove('has-bg');
        mBg.style.transition = 'none'; mBg.style.clipPath = 'circle(0px at 50% 50%)';
    }, 450);
    if (mode === 'landed') endLanding(); else syncUI();
}
function risingHearts(n) {
    const box = $('#hearts'), em = ['💗', '💖', '💕', '✨', '💜', '🌸'];
    for (let i = 0; i < n; i++) {
        const h = document.createElement('span');
        h.className = 'rise'; h.textContent = em[Math.floor(Math.random() * em.length)];
        h.style.left = rnd(4, 94) + 'vw';
        h.style.fontSize = rnd(16, 34) + 'px';
        h.style.setProperty('--d', rnd(2.4, 4.2) + 's');
        h.style.setProperty('--dx', rnd(-60, 60) + 'px');
        h.style.setProperty('--r', rnd(-25, 25) + 'deg');
        h.style.animationDelay = rnd(0, 0.9) + 's';
        h.addEventListener('animationend', () => h.remove());
        box.appendChild(h);
    }
}
$('#m-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal || e.target === mBg) closeModal(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const musicBtn = $('#music-btn');
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
let playing = false, audioEl = null, ac = null, master = null, chordTimer = null, chordIdx = 0;

function ambientNotes() {
    const chords = [[261.63,329.63,392,523.25],[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392]];
    const now = ac.currentTime, ch = chords[chordIdx++ % 4];
    ch.forEach((f, k) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now + k * 0.12);
        g.gain.linearRampToValueAtTime(0.5 / (k + 1.6), now + 1.3 + k * 0.12);
        g.gain.linearRampToValueAtTime(0, now + 4.3);
        o.connect(g); g.connect(master); o.start(now + k * 0.12); o.stop(now + 4.4);
    });
    for (let j = 0; j < 3; j++) {
        const o = ac.createOscillator(), g = ac.createGain(), at = now + 1 + j * 0.95;
        o.type = 'triangle'; o.frequency.value = ch[(j * 2 + 1) % 4] * 2;
        g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.16, at + 0.02); g.gain.exponentialRampToValueAtTime(0.001, at + 1.2);
        o.connect(g); g.connect(master); o.start(at); o.stop(at + 1.3);
    }
}
function ambientStart() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!ac) {
        ac = new AC(); master = ac.createGain(); master.gain.value = 0.13;
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
        master.connect(lp); lp.connect(ac.destination);
    }
    ac.resume(); ambientNotes();
    clearInterval(chordTimer); chordTimer = setInterval(ambientNotes, 4000);
}
function musicOn() {
    if (CONFIG.musica) {
        if (!audioEl) { audioEl = new Audio(CONFIG.musica); audioEl.loop = true; audioEl.onerror = () => { audioEl = null; CONFIG.musica = ''; ambientStart(); }; }
        audioEl.play().catch(() => {});
    } else ambientStart();
    playing = true; musicBtn.innerHTML = ICON_PAUSE;
}
function musicOff() {
    if (audioEl) audioEl.pause();
    if (ac) { clearInterval(chordTimer); ac.suspend(); }
    playing = false; musicBtn.innerHTML = ICON_PLAY;
}
musicBtn.innerHTML = ICON_PAUSE;
musicBtn.addEventListener('click', () => playing ? musicOff() : musicOn());

$('#fs-btn').addEventListener('click', () => {
    const el = document.documentElement;
    try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
        else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } catch (e) {}
});

$('#start-btn').addEventListener('click', () => {
    if (started) return;
    started = true; tStart = nowT();
    $('#start-overlay').classList.add('hide');
    document.body.classList.add('live');
    musicOn();
});

const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
const go = () => { buildItems(); syncUI(); requestAnimationFrame(frame); };
Promise.race([ready, new Promise(r => setTimeout(r, 1500))]).then(go);

})();
</script>
